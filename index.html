<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <script>
        // Redirecionamento automático após carregar a página
        window.onload = function () {
            window.location.href = "http://localhost:3000/menu.html"; // carrega o menu principal servido pelo backend
        };
    </script>
</head>

<body>
    <h1>Redirecionando para o Menu</h1>
    <p>Se o redirecionamento não funcionar automaticamente, <a href="http://localhost:3000/menu.html">clique aqui</a>.
    </p>
</body>

</html>
